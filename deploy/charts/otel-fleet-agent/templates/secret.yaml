{{- if not .Values.bootstrapToken.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "otel-fleet-agent.fullname" . }}
  labels:
    {{- include "otel-fleet-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.bootstrapToken.secretKey }}: {{ required "bootstrapToken.value or bootstrapToken.existingSecretName is required" .Values.bootstrapToken.value | quote }}
{{- end }}
