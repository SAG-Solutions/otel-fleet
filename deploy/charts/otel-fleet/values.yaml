# otel-fleet chart values.
#
# External stateful services are REQUIRED (bring your own):
# PostgreSQL (control-plane state), ClickHouse (telemetry) and a
# Prometheus-compatible store (collector self-telemetry, e.g. VictoriaMetrics).

images:
  controlPlane:
    repository: ghcr.io/sag-solutions/otel-fleet
    tag: ""            # defaults to the chart version
    pullPolicy: IfNotPresent
  collector:
    # Gateway/forwarding collector distro. Use the -slim image
    # (ghcr.io/sag-solutions/otel-fleet-collector-slim) when your pipelines
    # export only to self-hosted backends (ClickHouse, VictoriaMetrics, OTLP,
    # file) — it drops the five heavy SaaS/cloud exporters (Datadog,
    # Elasticsearch, Kafka, S3, Splunk). Keep the full image if any pipeline
    # uses those presets. The control plane always bundles the full distro for
    # pipeline validation, so slim gateways never block config authoring.
    repository: ghcr.io/sag-solutions/otel-fleet-collector
    tag: ""            # defaults to the chart version
    pullPolicy: IfNotPresent

imagePullSecrets: []

# Security hardening applied to every otel-fleet-managed workload (control
# plane, gateway, forwarding). Defaults assume the distroless nonroot images
# (uid/gid 65532). readOnlyRootFilesystem is left OFF because the collector's
# file_storage queue and the control plane's `otelcol validate` write to disk;
# enable it only with writable volumes mounted at those paths. Set either map
# to {} to omit it entirely.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  # readOnlyRootFilesystem: true   # opt-in; needs writable volumes for /tmp + file_storage

# PodDisruptionBudget for the control-plane and gateway deployments. Rendered
# only for a workload with more than one replica (a PDB over a single replica
# would block voluntary node drains).
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

external:
  # postgres://user:pass@host:5432/otelfleet — or set existingSecret below.
  databaseUrl: ""
  # Name of a Secret with key OTEL_FLEET_DATABASE_URL; takes precedence.
  databaseUrlSecret: ""
  clickhouse:
    addr: "clickhouse:9000"           # native protocol host:port
    database: otel
    user: otelfleet
    passwordSecret: ""                # Secret with key OTEL_FLEET_CLICKHOUSE_PASSWORD
    password: ""                      # inline fallback (dev only)
    # DSN used by the gateway collector's clickhouse exporter.
    exporterEndpoint: "tcp://clickhouse:9000?database=otel&username=otelfleet&password=otelfleet"
  victoriaMetrics:
    url: "http://victoriametrics:8428"
    remoteWriteUrl: "http://victoriametrics:8428/api/v1/write"

controlPlane:
  # all:   one deployment runs every role (simplest; single replica).
  # split: a stateless API tier (HTTP + gRPC, scale to api.replicas) plus an
  #        OpAMP tier (WebSockets + background workers, scale to opamp.replicas —
  #        HA via advisory-lock leader election for the singleton workers).
  #        Recommended for production.
  mode: all
  replicas: 1          # mode=all only: single combined replica
  api:
    replicas: 2        # mode=split only: stateless API tier replica count
  adminEmails: []      # e.g. ["ops@example.com"] — get role admin on first login
  devLogin: false
  baseUrl: ""          # external URL, required for OIDC redirects
  sessionSecure: true
  # Secret with key OTEL_FLEET_MASTER_KEY (base64, 32 bytes — e.g.
  # `openssl rand -base64 32`). Required for storing SSO providers and
  # pipeline credentials (encrypted at rest); without it those features
  # return a clear error.
  masterKeySecret: ""
  # Secret with key OTEL_FLEET_MASTER_KEY_SECONDARY (comma-separated old keys)
  # for zero-downtime key rotation: set the new key in masterKeySecret and the
  # previous one here, re-encrypt (Settings → SSO → Encryption at rest), then
  # clear this. See the configuration reference → Key rotation.
  masterKeySecondarySecret: ""
  oidc:
    # Env-defined fallback OIDC provider; additional providers (Google,
    # Microsoft, GitHub, generic OIDC) are managed in the UI under
    # Settings -> SSO and stored encrypted in the database.
    issuer: ""
    clientId: ""
    displayName: SSO
    clientSecretRef: ""   # Secret with key OTEL_FLEET_OIDC_CLIENT_SECRET
  # Extra environment variables for the control-plane container (verbatim
  # EnvVar entries), e.g. proxy settings.
  extraEnv: []
  # Per-client-IP rate limiting + request-body cap on the public HTTP surface.
  # Leave empty to use the server defaults (rps 50 / burst 100; auth endpoints
  # rps 5 / burst 10; body cap 4 MiB). Set enabled: false if a fronting proxy
  # already rate-limits. Only keys you set are passed through.
  rateLimit: {}
    # enabled: true
    # rps: 50
    # burst: 100
    # authRps: 5
    # authBurst: 10
    # maxRequestBodyBytes: 4194304
  # In-cluster TLS. When disabled the listeners are plaintext (terminate TLS
  # at an ingress in front). When enabled the pods serve TLS directly.
  tls:
    enabled: false
    # Secret (type kubernetes.io/tls: tls.crt + tls.key) for the public
    # listeners — HTTPS on :8080 and wss:// OpAMP on :4320.
    publicSecretName: ""
    # Secret (tls.crt + tls.key, and ca.crt for mTLS) for the internal gRPC
    # AuthService the gateway collectors call.
    grpcSecretName: ""
    # Require gateway collectors to present a client cert (mTLS). The gRPC
    # secret must then include ca.crt (the CA that signs client certs).
    grpcMTLS: false
    # Secret with ca.crt: when set (and tls.enabled), the public OpAMP listener
    # (:4320) requires and verifies an agent client cert signed by this CA
    # (mTLS), on top of the enrollment token. Pair with the agent chart's
    # opamp.tls.clientCertSecret.
    opampClientCASecret: ""
    # Optionally let cert-manager issue the two secrets from an Issuer.
    certManager:
      enabled: false
      # dnsNames the public cert should cover (OpAMP/HTTPS hostnames).
      publicDNSNames: []
      issuerRef: {}   # { name: my-issuer, kind: ClusterIssuer }
  # publish: forwarding pods pull config from the ops endpoint (restart to
  # apply). k8s: control plane patches the OpenTelemetryCollector CR (requires
  # the opentelemetry-operator and forwarding.mode=operator).
  distributor: publish
  opamp:
    # mode=split only: OpAMP tier replica count. Safe to raise above 1 for HA —
    # each replica owns its own agent WebSockets, every replica gets edge-config
    # NOTIFYs (broadcast LISTEN) and pushes to its own agents, and the fleet-wide
    # singletons (retention sweep, alert evaluator) run on exactly one replica
    # via PostgreSQL advisory-lock leader election, failing over automatically.
    replicas: 1
    service:
      # How edge agents (customer networks!) reach the OpAMP endpoint.
      type: ClusterIP   # set LoadBalancer or wire an ingress/gateway for production
      port: 4320
      # IP allowlist for a type: LoadBalancer OpAMP endpoint (cloud LB enforced).
      loadBalancerSourceRanges: []
    # Externally reachable OpAMP URL offered to edge agents with their
    # per-agent token (e.g. wss://opamp.example.com/v1/opamp). Empty = offer
    # only the new auth header; agents keep their current endpoint.
    publicEndpoint: ""
  # Ingress NetworkPolicy for the control-plane pods. The public listeners
  # (HTTP :8080, OpAMP :4320) stay open unless publicCIDRs is set; the internal
  # listeners (gRPC AuthService :9443, ops/metrics :9090) are restricted to
  # same-namespace pods plus any extra namespaces/CIDRs. Requires a CNI that
  # enforces NetworkPolicy.
  networkPolicy:
    enabled: false
    publicCIDRs: []        # restrict HTTP :8080 + OpAMP :4320 (empty = anywhere)
    internalNamespaces: [] # extra namespaces allowed to reach :9443 + :9090 (e.g. monitoring)
    internalCIDRs: []      # extra CIDRs allowed to reach the internal listeners
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

ingress:
  enabled: false
  className: ""
  host: ""
  tls: []
  annotations: {}

gateway:
  enabled: true
  replicas: 2
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { memory: 1Gi }
  service:
    type: ClusterIP     # front with LB/ingress-grpc for customer OTLP in production
    # IP allowlist for a type: LoadBalancer service — the cloud LB enforces it
    # in front of the public OTLP endpoint. e.g. ["203.0.113.0/24"]
    loadBalancerSourceRanges: []
  # TLS / mTLS on the public OTLP ingest receiver. Certs come from a
  # kubernetes.io/tls Secret (tls.crt + tls.key, plus ca.crt when mtls). Served
  # via a config overlay merged onto the static gateway config.
  ingestTLS:
    enabled: false
    mtls: false        # also require and verify a client certificate
    secretName: ""     # required when enabled
  persistentQueue:
    enabled: false      # PVC-backed sending queue for the clickhouse exporter
    size: 5Gi
    storageClassName: ""
  # KEDA autoscaling (requires the KEDA operator; keda.enabled below). When
  # off, replicas above is the fixed count.
  autoscaling:
    minReplicas: 2
    maxReplicas: 10
    cpuUtilization: 70   # scale on CPU %
    # Optional: also scale on ingest rate per pod (needs the Prometheus
    # scaler pointed at the metrics store). 0 disables this trigger.
    ingestRatePerReplica: 0

forwarding:
  enabled: true
  # deployment: plain Deployment pulling its config from the control plane's
  # ops endpoint at pod start (kubectl rollout restart to apply changes).
  # operator: an OpenTelemetryCollector CR managed by the control plane
  # (set controlPlane.distributor=k8s; requires the opentelemetry-operator).
  mode: deployment
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { memory: 512Mi }
  # KEDA autoscaling for the forwarding tier (deployment mode only). The
  # right signal is exporter queue utilization — needs the Prometheus scaler.
  autoscaling:
    minReplicas: 1        # can scale to 0 when no tenant has forwarding pipelines
    maxReplicas: 6
    cpuUtilization: 70
    # Prometheus scaler on max exporter queue fill ratio across the tier.
    queueUtilization: 0.7

# KEDA-based autoscaling. Requires the KEDA operator installed in the cluster
# (https://keda.sh). When disabled, the tiers run at their fixed replica counts.
keda:
  enabled: false
  # PromQL endpoint for the Prometheus scaler (VictoriaMetrics is compatible).
  prometheusAddress: "http://victoriametrics:8428"
  pollingInterval: 30
  cooldownPeriod: 300

# Opt-in cluster-monitoring bundle: an OpenTelemetry-native alternative to
# kube-prometheus-stack's metrics collection. Two collectors (both running the
# otel-fleet collector distro) remote-write to external.victoriaMetrics:
#   - a DaemonSet (per node): hostmetrics (~node-exporter) + kubeletstats
#     (~cAdvisor), reading the host filesystem read-only at /hostfs.
#   - a singleton Deployment: k8s_cluster (~kube-state-metrics) + a prometheus
#     receiver that scrapes pods carrying prometheus.io/{scrape,port,path}.
# A dedicated ServiceAccount + ClusterRole grant the read access these need.
clusterMonitoring:
  enabled: false
  node:
    # kubeletstats scrapes the local kubelet over HTTPS; kubelet serving certs
    # are typically self-signed, so verification is skipped by default. Set
    # false if your kubelet presents a cert trusted by the pod's CA bundle.
    kubeletInsecureSkipVerify: true
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 300Mi }
  cluster:
    # Replicas of the cluster tier (k8s_cluster + prometheus scrape). Safe to
    # raise above 1 for HA ONLY with targetAllocator.enabled: the allocator
    # shards prometheus scrape targets across replicas, and the k8s_cluster
    # receiver uses leader election so only one replica emits cluster metrics.
    # Without the allocator, >1 replica would double-scrape annotation targets.
    replicas: 1
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { memory: 512Mi }
  # Target Allocator: ingest existing prometheus-operator ServiceMonitor and
  # PodMonitor CRDs so kube-prometheus-stack users migrate without rewriting
  # scrape config. When enabled, a standalone Target Allocator discovers those
  # CRDs (and the annotation job) and hands scrape targets to the cluster
  # collector, whose prometheus receiver switches to target_allocator mode.
  # Requires the monitoring.coreos.com CRDs (ServiceMonitor/PodMonitor) to be
  # installed in the cluster — they can be applied standalone, without the
  # full Prometheus Operator.
  targetAllocator:
    enabled: false
    image:
      repository: ghcr.io/open-telemetry/opentelemetry-operator/target-allocator
      tag: "0.156.0"
      pullPolicy: IfNotPresent
    # Empty selectors ({}) discover ALL ServiceMonitors/PodMonitors cluster-wide.
    # Narrow with matchLabels to scope to a subset.
    serviceMonitorSelector: {}
    podMonitorSelector: {}
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 256Mi }
  # Curated Grafana dashboards for the cluster-monitoring metrics, shipped as
  # ConfigMaps for a sidecar-enabled Grafana to auto-import. Panels use a
  # datasource template variable, so point them at your VictoriaMetrics
  # (Prometheus) datasource. Metric names match this bundle's output.
  dashboards:
    enabled: false
    label: grafana_dashboard    # sidecar discovery label key
    labelValue: "1"
    folderAnnotation: ""        # e.g. "grafana_folder" to file them in a folder
    folder: otel-fleet

serviceAccount:
  create: true
  annotations: {}

podLabels: {}
nodeSelector: {}
tolerations: []

# Scheduled backups. PostgreSQL holds the irreplaceable control-plane state
# (customers, keys, pipelines, agents, users) and is backed up by default when
# enabled; ClickHouse telemetry is TTL-bounded and reconstructable, so its
# backup is optional. See RECOVERY.md for restore procedures.
backup:
  postgres:
    enabled: false
    schedule: "0 2 * * *"        # daily 02:00
    image: postgres:17-alpine
    retentionDays: 14
    storage:
      size: 10Gi
      storageClassName: ""
    # DATABASE_URL source: reuse external.databaseUrl / external.databaseUrlSecret.
  clickhouse:
    enabled: false
    schedule: "0 3 * * *"
    # clickhouse-backup handles full/incremental backups to S3-compatible
    # storage; configure it via a Secret referenced here (see its docs).
    image: altinity/clickhouse-backup:latest
    envSecretName: ""            # Secret with clickhouse-backup S3 + CH creds
