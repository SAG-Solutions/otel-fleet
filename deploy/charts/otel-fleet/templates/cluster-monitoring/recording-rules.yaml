{{- if and .Values.clusterMonitoring.enabled .Values.clusterMonitoring.recordingRules.enabled }}
{{- /*
vmalert running recording rules only: it queries VictoriaMetrics for each
rule's expr and writes the resulting series back via remote-write. No notifier
(alerting stays native in otel-fleet). Rules come from files/recording-rules.yaml.
*/}}
{{- $rr := .Values.clusterMonitoring.recordingRules }}
{{- $vm := .Values.external.victoriaMetrics.url }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-fleet.fullname" . }}-recording-rules
  labels:
    {{- include "otel-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-monitoring-recording
data:
  recording-rules.yaml: |
{{ .Files.Get "files/recording-rules.yaml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "otel-fleet.fullname" . }}-recording-rules
  labels:
    {{- include "otel-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-monitoring-recording
spec:
  # Singleton: recording rules are idempotent, one evaluator is enough.
  replicas: 1
  selector:
    matchLabels:
      {{- include "otel-fleet.selector" . | nindent 6 }}
      app.kubernetes.io/component: cluster-monitoring-recording
  template:
    metadata:
      labels:
        {{- include "otel-fleet.labels" . | nindent 8 }}
        app.kubernetes.io/component: cluster-monitoring-recording
      annotations:
        checksum/rules: {{ .Files.Get "files/recording-rules.yaml" | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vmalert
          image: {{ $rr.image.repository }}:{{ $rr.image.tag }}
          imagePullPolicy: {{ $rr.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --rule=/etc/vmalert/rules/recording-rules.yaml
            {{- range $rr.additionalRuleConfigMaps }}
            - --rule=/etc/vmalert/rules-extra/{{ . }}/*.yaml
            {{- end }}
            - --datasource.url={{ $vm }}
            - --remoteWrite.url={{ $vm }}
            {{- if $rr.notifierUrl }}
            - --notifier.url={{ $rr.notifierUrl }}
            {{- end }}
            - --evaluationInterval={{ $rr.evaluationInterval }}
          ports:
            - { name: http, containerPort: 8880 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
          volumeMounts:
            - { name: rules, mountPath: /etc/vmalert/rules, readOnly: true }
            {{- range $rr.additionalRuleConfigMaps }}
            - { name: extra-{{ . }}, mountPath: /etc/vmalert/rules-extra/{{ . }}, readOnly: true }
            {{- end }}
          resources: {{- toYaml $rr.resources | nindent 12 }}
      volumes:
        - name: rules
          configMap:
            name: {{ include "otel-fleet.fullname" . }}-recording-rules
        {{- range $rr.additionalRuleConfigMaps }}
        - name: extra-{{ . }}
          configMap:
            name: {{ . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
