{{- if .Values.clusterMonitoring.enabled }}
{{- /*
Cluster-wide read access shared by both cluster-monitoring collectors:
  - kubeletstats  -> nodes/stats, nodes/proxy (per-node kubelet scrape)
  - k8s_cluster   -> the full set of workload/quota/event objects it counts
  - prometheus SD -> pods, services, endpoints, nodes for target discovery
  - k8sattributes -> pods, namespaces, replicasets for metadata enrichment
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "otel-fleet.fullname" . }}-cluster-monitoring
  labels:
    {{- include "otel-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-monitoring
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "otel-fleet.fullname" . }}-cluster-monitoring
  labels:
    {{- include "otel-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-monitoring
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/stats
      - nodes/proxy
      - pods
      - services
      - endpoints
      - namespaces
      - namespaces/status
      - nodes/status
      - pods/status
      - persistentvolumes
      - persistentvolumeclaims
      - replicationcontrollers
      - replicationcontrollers/status
      - resourcequotas
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources:
      - daemonsets
      - deployments
      - replicasets
    verbs: ["get", "list", "watch"]
  # Prometheus kubernetes_sd can be given raw kubelet /metrics access.
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
  # Leader election (k8sleaderelector) for the k8s_cluster receiver, so the
  # cluster tier can run HA (clusterMonitoring.cluster.replicas > 1).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- if .Values.clusterMonitoring.targetAllocator.enabled }}
  # Target Allocator: discover prometheus-operator ServiceMonitor/PodMonitor
  # (and probe/scrapeconfig) CRDs. Harmless if the CRDs are not installed.
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors", "probes", "scrapeconfigs"]
    verbs: ["get", "list", "watch"]
  # EndpointSlice service discovery for ServiceMonitor targets (role:
  # endpointslice); the base rules above cover only core endpoints.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # The prometheus-CR watcher builds informers for secrets/configmaps to
  # resolve ServiceMonitor scrape auth (bearer tokens, TLS); without these its
  # cache never syncs and no targets are allocated.
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "otel-fleet.fullname" . }}-cluster-monitoring
  labels:
    {{- include "otel-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "otel-fleet.fullname" . }}-cluster-monitoring
subjects:
  - kind: ServiceAccount
    name: {{ include "otel-fleet.fullname" . }}-cluster-monitoring
    namespace: {{ .Release.Namespace }}
{{- end }}
