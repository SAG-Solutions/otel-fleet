{{- if .Values.clusterMonitoring.enabled }}
{{- /*
Cluster-wide read access shared by both cluster-monitoring collectors:
  - kubeletstats  -> nodes/stats, nodes/proxy (per-node kubelet scrape)
  - k8s_cluster   -> the full set of workload/quota/event objects it counts
  - prometheus SD -> pods, services, endpoints, nodes for target discovery
  - k8sattributes -> pods, namespaces, replicasets for metadata enrichment
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "otel-fleet.fullname" . }}-cluster-monitoring
  labels:
    {{- include "otel-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-monitoring
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "otel-fleet.fullname" . }}-cluster-monitoring
  labels:
    {{- include "otel-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-monitoring
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/stats
      - nodes/proxy
      - pods
      - services
      - endpoints
      - namespaces
      - namespaces/status
      - nodes/status
      - pods/status
      - persistentvolumes
      - persistentvolumeclaims
      - replicationcontrollers
      - replicationcontrollers/status
      - resourcequotas
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources:
      - daemonsets
      - deployments
      - replicasets
    verbs: ["get", "list", "watch"]
  # Prometheus kubernetes_sd can be given raw kubelet /metrics access.
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "otel-fleet.fullname" . }}-cluster-monitoring
  labels:
    {{- include "otel-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "otel-fleet.fullname" . }}-cluster-monitoring
subjects:
  - kind: ServiceAccount
    name: {{ include "otel-fleet.fullname" . }}-cluster-monitoring
    namespace: {{ .Release.Namespace }}
{{- end }}
