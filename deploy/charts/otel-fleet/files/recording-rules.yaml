# Curated recording rules for the otel-fleet cluster-monitoring metrics,
# evaluated by vmalert and written back to VictoriaMetrics. They precompute the
# common cluster/namespace rollups so dashboards and alerts query one cheap
# series instead of aggregating raw series on every load. Naming follows the
# Prometheus level:metric:operation convention. Add your own groups here.
groups:
  - name: otel-fleet.nodes
    interval: 30s
    rules:
      - record: cluster:node_cpu_usage:sum
        expr: sum(k8s_node_cpu_usage)
      - record: cluster:node_memory_usage_bytes:sum
        expr: sum(k8s_node_memory_usage_bytes)
      - record: node:network_io_bytes:rate5m
        expr: sum by (k8s_node_name) (rate(k8s_node_network_io_bytes_total[5m]))

  - name: otel-fleet.workloads
    interval: 30s
    rules:
      - record: namespace:pod_cpu_usage:sum
        expr: sum by (k8s_namespace_name) (k8s_pod_cpu_usage)
      - record: namespace:pod_memory_usage_bytes:sum
        expr: sum by (k8s_namespace_name) (k8s_pod_memory_usage_bytes)
      - record: namespace:pods:count
        expr: count by (k8s_namespace_name) (k8s_pod_phase)
