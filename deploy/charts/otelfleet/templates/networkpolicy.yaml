{{- if .Values.controlPlane.networkPolicy.enabled }}
{{- $np := .Values.controlPlane.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "otelfleet.fullname" . }}-control-plane
  labels:
    {{- include "otelfleet.labels" . | nindent 4 }}
spec:
  # Targets every control-plane pod (all/api/opamp components); gateway and
  # forwarding share the base selector, so component is matched explicitly.
  podSelector:
    matchLabels:
      {{- include "otelfleet.selector" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [control-plane, api, opamp]
  policyTypes: [Ingress]
  ingress:
    # Public listeners: the HTTP UI/API (8080) and OpAMP for edge agents (4320).
    # No `from` = reachable from anywhere; set publicCIDRs to restrict.
    - ports:
        - { port: 8080, protocol: TCP }
        - { port: 4320, protocol: TCP }
      {{- with $np.publicCIDRs }}
      from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      {{- end }}
    # Internal listeners: the gRPC AuthService (9443, gateways) and ops/metrics
    # (9090, scrapers). Restricted to in-cluster sources — same-namespace pods
    # always, plus any extra namespaces/CIDRs.
    - ports:
        - { port: 9443, protocol: TCP }
        - { port: 9090, protocol: TCP }
      from:
        - podSelector: {}
        {{- range $np.internalNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- range $np.internalCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
{{- end }}
