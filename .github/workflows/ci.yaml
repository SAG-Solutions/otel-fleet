name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # DB-backed store tests: run the real goose migrations against a real
  # PostgreSQL and exercise every store query/scan. Catches SQL/column-scan
  # regressions that fakes cannot (see internal/store/integration_test.go).
  store-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: otelfleet
          POSTGRES_PASSWORD: otelfleet
          POSTGRES_DB: otel_fleet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U otelfleet"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags=integration ./internal/store/... ./internal/leader/...
        env:
          OTEL_FLEET_TEST_DATABASE_URL: postgres://otelfleet:otelfleet@localhost:5432/otel_fleet_test

  # Full-stack smoke: bring up PG + ClickHouse + the gateway via compose, run
  # the control plane, then drive dev-login → create customer → send OTLP → read
  # it back through Explore (real ingest + auth + query path).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start data plane (postgres, clickhouse, victoriametrics, gateway)
        run: docker compose -f deploy/compose/docker-compose.yaml up -d --build postgres clickhouse victoriametrics gateway
      - name: Wait for postgres + clickhouse healthy
        run: |
          cd deploy/compose
          for i in $(seq 1 40); do
            pg=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q postgres)" 2>/dev/null || echo none)
            ch=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q clickhouse)" 2>/dev/null || echo none)
            echo "postgres=$pg clickhouse=$ch"
            [ "$pg" = healthy ] && [ "$ch" = healthy ] && exit 0
            sleep 5
          done
          echo "::error::data plane did not become healthy"; exit 1
      - name: Build and run the control plane
        run: |
          go build -o /tmp/otel-fleet ./cmd/otel-fleet
          OTEL_FLEET_DEV_LOGIN=true \
          OTEL_FLEET_ADMIN_EMAILS=js@sag-solutions.com \
          OTEL_FLEET_DATABASE_URL=postgres://otelfleet:otelfleet@localhost:5432/otelfleet \
          OTEL_FLEET_CLICKHOUSE_ADDR=localhost:9000 \
          OTEL_FLEET_CLICKHOUSE_DATABASE=otel \
          OTEL_FLEET_CLICKHOUSE_USER=otelfleet \
          OTEL_FLEET_CLICKHOUSE_PASSWORD=otelfleet \
          nohup /tmp/otel-fleet > /tmp/cp.log 2>&1 &
          # Poll the ops health endpoint (:9090); "/" on :8080 needs a web dir
          # we don't ship in CI, so it 404s and is not a readiness signal.
          for i in $(seq 1 30); do curl -sf localhost:9090/healthz >/dev/null 2>&1 && exit 0; sleep 2; done
          echo "::error::control plane did not come up"; cat /tmp/cp.log; exit 1
      - name: Run e2e smoke
        run: go test -tags=e2e ./test/e2e/... -v -timeout 180s
        env:
          OTEL_FLEET_E2E_URL: http://localhost:8080
          OTEL_FLEET_E2E_OTLP_HTTP: http://localhost:4318
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== control plane ==="; cat /tmp/cp.log || true
          echo "=== gateway ==="; docker compose -f deploy/compose/docker-compose.yaml logs --tail=120 gateway || true

  # Real-cluster e2e for the cluster-monitoring bundle: spin up kind, load the
  # (slim) collector image, deploy the bundle + an in-cluster VictoriaMetrics,
  # and assert the DaemonSet + singleton actually scrape and remote-write k8s_*
  # and system_* metrics. This is the kube-prometheus-stack replacement verified
  # against a live cluster (previously only helm-template-checked).
  cluster-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the slim collector image
        run: docker build --build-arg BUILDER_CONFIG=builder-config.slim.yaml -f Dockerfile.collector -t otel-fleet-collector:e2e .
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: otelfleet-e2e
      - name: Load collector image into kind
        run: kind load docker-image otel-fleet-collector:e2e --name otelfleet-e2e
      - name: Run cluster-monitoring e2e
        run: test/e2e-cluster/run.sh
        env:
          KCTX: kind-otelfleet-e2e
          COLLECTOR_IMAGE: otel-fleet-collector
          COLLECTOR_TAG: e2e
      - name: Run Target Allocator e2e (ServiceMonitor ingest)
        run: test/e2e-cluster/run-ta.sh
        env:
          KCTX: kind-otelfleet-e2e
          COLLECTOR_IMAGE: otel-fleet-collector
          COLLECTOR_TAG: e2e

  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make gen-go
      - run: git diff --exit-code

  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test custom components
        run: make -C collector test
      - name: Check slim/full invariant
        run: make -C collector check-slim
      - name: Build distro (OCB)
        run: make -C collector build
      - name: Validate gateway config
        run: make -C collector validate
        env:
          OTEL_FLEET_AUTH_ENDPOINT: localhost:9443
          CLICKHOUSE_ENDPOINT: tcp://localhost:9000?database=otel

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen && git diff --exit-code ../api
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet
      - name: Template forwarding modes and KEDA autoscaling
        run: |
          helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet > /dev/null
          helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set forwarding.mode=operator --set controlPlane.distributor=k8s > /dev/null
          helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set keda.enabled=true --set gateway.autoscaling.ingestRatePerReplica=5000 > /dev/null
          helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set gateway.service.type=LoadBalancer --set 'gateway.service.loadBalancerSourceRanges={10.0.0.0/8}' \
            --set gateway.ingestTLS.enabled=true --set gateway.ingestTLS.mtls=true \
            --set gateway.ingestTLS.secretName=gw-tls > /dev/null
          helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set controlPlane.tls.enabled=true --set controlPlane.tls.publicSecretName=cp-tls \
            --set controlPlane.tls.opampClientCASecret=opamp-ca \
            --set controlPlane.opamp.service.type=LoadBalancer \
            --set 'controlPlane.opamp.service.loadBalancerSourceRanges={198.51.100.0/24}' > /dev/null
          helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set controlPlane.rateLimit.enabled=true --set controlPlane.rateLimit.rps=25 \
            --set controlPlane.rateLimit.authBurst=8 --set controlPlane.rateLimit.maxRequestBodyBytes=1048576 \
            | grep -q OTEL_FLEET_RATE_LIMIT_RPS
          # Hardened defaults: nonroot securityContext on all workloads; a
          # gateway PDB (replicas=2) but none for the single-replica control plane.
          helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            | grep -q "runAsNonRoot: true"
          test "$(helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            | grep -c 'kind: PodDisruptionBudget')" = "1"
          test "$(helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set controlPlane.mode=split | grep -c 'kind: PodDisruptionBudget')" = "2"
          # OpAMP tier is HA-capable: raising opamp.replicas scales the Deployment
          # and adds its PDB (singleton workers stay leader-elected in-process).
          test "$(helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set controlPlane.mode=split --set controlPlane.opamp.replicas=3 | grep -c 'kind: PodDisruptionBudget')" = "3"
          # Control-plane NetworkPolicy: off by default; renders with restrictions.
          test "$(helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            | grep -c 'kind: NetworkPolicy')" = "0"
          helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set controlPlane.networkPolicy.enabled=true \
            --set 'controlPlane.networkPolicy.publicCIDRs={203.0.113.0/24}' \
            --set 'controlPlane.networkPolicy.internalNamespaces={monitoring}' | grep -q "kind: NetworkPolicy"
          # Cluster-monitoring bundle: off by default (zero DaemonSets / RBAC);
          # opt-in renders the per-node DaemonSet, the singleton Deployment and
          # the shared ServiceAccount + ClusterRole + ClusterRoleBinding.
          test "$(helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            | grep -c 'kind: DaemonSet')" = "0"
          test "$(helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            | grep -c 'kind: ClusterRoleBinding')" = "0"
          test "$(helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set clusterMonitoring.enabled=true | grep -c 'kind: DaemonSet')" = "1"
          helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set clusterMonitoring.enabled=true | grep -q "kind: ClusterRole"
          helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set clusterMonitoring.enabled=true | grep -q "otel-fleet-cluster-monitoring"
          # Target Allocator (ServiceMonitor/PodMonitor ingest): off by default;
          # opt-in renders the TA workload + monitoring.coreos.com RBAC and
          # switches the cluster collector's prometheus receiver to TA mode.
          test "$(helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set clusterMonitoring.enabled=true | grep -c 'component: cluster-monitoring-ta')" = "0"
          helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set clusterMonitoring.enabled=true --set clusterMonitoring.targetAllocator.enabled=true \
            | grep -q 'name: t-otel-fleet-target-allocator'
          helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set clusterMonitoring.enabled=true --set clusterMonitoring.targetAllocator.enabled=true \
            | grep -q 'servicemonitors'
          helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set clusterMonitoring.enabled=true --set clusterMonitoring.targetAllocator.enabled=true \
            | grep -q 'target_allocator:'
          # Cluster tier HA: leader election + leases RBAC always present; the
          # replica count is values-driven and guarded to require the allocator.
          helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set clusterMonitoring.enabled=true | grep -q 'k8s_leader_elector'
          helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set clusterMonitoring.enabled=true | grep -q 'leases'
          # replicas>1 WITHOUT the allocator must fail template rendering.
          if helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set clusterMonitoring.enabled=true --set clusterMonitoring.cluster.replicas=2 >/dev/null 2>&1; then
            echo "::error::cluster.replicas=2 without targetAllocator should have failed"; exit 1
          fi
          # replicas>1 WITH the allocator renders cleanly.
          helm template t deploy/charts/otel-fleet --set external.databaseUrl=postgres://x:y@pg:5432/otelfleet \
            --set clusterMonitoring.enabled=true --set clusterMonitoring.targetAllocator.enabled=true \
            --set clusterMonitoring.cluster.replicas=2 >/dev/null
      - run: helm lint deploy/charts/otel-fleet-agent --set opamp.endpoint=wss://idp/v1/opamp --set bootstrapToken.value=otm_bt_x
      - name: Template edge-agent chart (inline token, and existing-secret + no-persistence)
        run: |
          helm template a deploy/charts/otel-fleet-agent \
            --set opamp.endpoint=wss://idp/v1/opamp --set bootstrapToken.value=otm_bt_x --set region=eu > /dev/null
          helm template a deploy/charts/otel-fleet-agent \
            --set opamp.endpoint=wss://idp/v1/opamp --set bootstrapToken.existingSecret=s --set persistence.enabled=false > /dev/null
          helm template a deploy/charts/otel-fleet-agent \
            --set opamp.endpoint=wss://idp/v1/opamp --set bootstrapToken.value=otm_bt_x \
            --set opamp.tls.clientCertSecret=mtls --set opamp.tls.serverName=idp \
            --set autoscaling.enabled=true --set networkPolicy.enabled=true \
            --set 'networkPolicy.allowedCIDRs={10.0.0.0/8}' > /dev/null

  # Exercise the release config on every push: goreleaser only runs on a tag,
  # so archive/build mistakes (e.g. per-platform binary-count mismatches) would
  # otherwise stay invisible until the release fails. A snapshot release does a
  # full build + archive without publishing — `goreleaser check` alone does not
  # catch archive-level errors.
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser inspects git state
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign

  collector-image:
    runs-on: ubuntu-latest
    needs: [collector]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -f Dockerfile.collector .

  control-plane-image:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build .
