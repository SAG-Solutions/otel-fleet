name: release-please

# Automated releases. release-please watches Conventional Commits on main and
# maintains a "release PR" (version bump + CHANGELOG + Chart.yaml versions).
# Merging that PR tags vX.Y.Z, creates the GitHub Release, and — in the SAME
# workflow run (so no PAT is needed to trigger downstream) — runs goreleaser,
# builds/pushes the images and packages/signs the Helm charts.

on:
  push:
    branches: [main]

permissions:
  contents: write # release-please: create tags/releases; goreleaser: upload assets
  packages: write # push images + charts to GHCR
  pull-requests: write # release-please: maintain the release PR
  id-token: write # cosign keyless signing

env:
  # GHCR requires a lowercase owner; the org is "SAG-Solutions".
  REGISTRY: ghcr.io/sag-solutions

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0 # full history for the changelog
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # syft powers the goreleaser `sboms` stanza (one SPDX SBOM per archive).
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Per-arch native builds. Each (image × arch) builds on its OWN native runner
  # (amd64 → ubuntu-latest, arm64 → ubuntu-24.04-arm) and pushes by digest with
  # no tag. This replaces the previous single-runner QEMU emulation of arm64,
  # which took hours for the heavy Go + bundled-collector images. The `merge`
  # job below assembles the per-arch digests into one tagged multi-arch index.
  images:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - {name: otel-fleet, dockerfile: Dockerfile}
          - {name: otel-fleet-collector, dockerfile: Dockerfile.collector}
          - {name: otel-fleet-supervisor, dockerfile: Dockerfile.supervisor}
          # Slim variants: the same distro minus the five heavy SaaS/cloud
          # exporters (Datadog/Elasticsearch/Kafka/S3/Splunk). Opt-in via
          # images.collector.repository / agent supervisor.repository.
          - {name: otel-fleet-collector-slim, dockerfile: Dockerfile.collector, buildArgs: BUILDER_CONFIG=builder-config.slim.yaml}
          - {name: otel-fleet-supervisor-slim, dockerfile: Dockerfile.supervisor, buildArgs: BUILDER_CONFIG=builder-config.slim.yaml}
        platform:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      # No QEMU — the runner is native for its arch.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          build-args: ${{ matrix.image.buildArgs }}
          platforms: linux/${{ matrix.platform.arch }}
          # Push the per-arch image by digest only (no tag); the merge job tags
          # the assembled index. Per-arch SBOM + max-mode SLSA provenance.
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          IMAGE: ${{ matrix.image.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble each image's per-arch digests into one tagged multi-arch index,
  # then sign the index. One job per image.
  merge:
    needs: [release-please, images]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - otel-fleet
          - otel-fleet-collector
          - otel-fleet-supervisor
          - otel-fleet-collector-slim
          - otel-fleet-supervisor-slim
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Resolve version from tag
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
      - name: Create and push manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          refs=""
          for f in *; do refs="$refs ${REGISTRY}/${IMAGE}@sha256:${f}"; done
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE}:${VERSION}" \
            -t "${REGISTRY}/${IMAGE}:latest" \
            $refs
      - name: Resolve index digest
        id: idx
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE}:${VERSION}" --format '{{ .Manifest.Digest }}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Sign image index (cosign keyless)
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.idx.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"

  helm-chart:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: azure/setup-helm@v4
      - uses: sigstore/cosign-installer@v3
      # Writes ~/.docker/config.json so BOTH `helm push` and `cosign sign`
      # (which resolves GHCR creds from the docker config, not helm's own
      # store) are authenticated. `helm registry login` alone left cosign
      # unauthenticated and its signature upload failed with UNAUTHORIZED.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version from tag
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
      - name: Verify chart versions match the tag
        run: |
          for chart in otel-fleet otel-fleet-agent; do
            chart_version=$(helm show chart "deploy/charts/$chart" | awk '/^version:/ {print $2}')
            if [ "$chart_version" != "${{ steps.version.outputs.version }}" ]; then
              echo "::error::Chart $chart version ($chart_version) != release version (${{ steps.version.outputs.version }})." \
                   "release-please should bump deploy/charts/$chart/Chart.yaml — check the x-release-please-version annotations."
              exit 1
            fi
          done
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Package, push and sign charts
        run: |
          for chart in otel-fleet otel-fleet-agent; do
            helm package "deploy/charts/$chart" --destination dist/
            out=$(helm push "dist/$chart-${{ steps.version.outputs.version }}.tgz" "oci://${REGISTRY}/charts" 2>&1)
            echo "$out"
            digest=$(echo "$out" | awk '/Digest:/ {print $2}')
            cosign sign --yes "${REGISTRY}/charts/$chart@${digest}"
          done
