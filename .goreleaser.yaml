# GoReleaser config for the otel-fleet control-plane binary.
# Container images (control plane, collector, supervisor) and the Helm chart
# are NOT built here — see .github/workflows/release.yaml.
#
# Note: the bare binary serves the API only. The web UI (OTEL_FLEET_WEB_DIR)
# and the collector binary for pipeline validation (OTEL_FLEET_OTELCOL_BIN)
# are provided externally; the container image bundles both.
version: 2

project_name: otel-fleet

builds:
  - id: otel-fleet
    main: ./cmd/otel-fleet
    binary: otel-fleet
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
  - id: otel-fleetctl
    main: ./cmd/otel-fleetctl
    binary: otel-fleetctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  # One archive per binary: otel-fleet builds linux/darwin, otel-fleetctl also
  # builds windows, so a single archive would have a different binary count
  # per platform (goreleaser rejects that).
  - id: otel-fleet
    ids: [otel-fleet]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
  - id: otel-fleetctl
    ids: [otel-fleetctl]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "otel-fleetctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per release archive (syft), uploaded alongside the binaries.
sboms:
  - id: archives
    artifacts: archive

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: Documentation
      regexp: '^docs(\(.+\))?!?:'
      order: 3
    - title: Other
      order: 999
  filters:
    exclude:
      - '^chore(\(.+\))?!?:'
      - '^test(\(.+\))?!?:'
      - '^ci(\(.+\))?!?:'

release:
  draft: false
  prerelease: auto
  # release-please creates the GitHub Release (with the changelog) when it tags;
  # goreleaser only appends the built binaries/archives to it.
  mode: append
  footer: |
    ---

    **Supply chain**: release archives ship an SPDX SBOM (`*.sbom.json`);
    container images carry a buildkit SBOM + max-mode SLSA build provenance
    attestation and are cosign-signed (keyless). See the docs → verifying
    artifacts.

    **Container images** (multi-arch, cosign-signed):

    - `ghcr.io/sag-solutions/otel-fleet:{{ .Version }}` — control plane (binary + web UI + collector for validation)
    - `ghcr.io/sag-solutions/otel-fleet-collector:{{ .Version }}` — gateway/forwarding collector distro
    - `ghcr.io/sag-solutions/otel-fleet-collector-slim:{{ .Version }}` — same, minus the heavy Datadog/Elasticsearch/Kafka/S3/Splunk exporters
    - `ghcr.io/sag-solutions/otel-fleet-supervisor:{{ .Version }}` — edge agent (OpAMP supervisor + collector)
    - `ghcr.io/sag-solutions/otel-fleet-supervisor-slim:{{ .Version }}` — edge agent, slim collector

    **Helm chart**: `helm install otel-fleet oci://ghcr.io/sag-solutions/charts/otel-fleet --version {{ .Version }}`
